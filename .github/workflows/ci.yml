# Runs on every push and pull request: compiles the ESP32-S3 firmware, using
# firmware/sketch.yaml (with secrets.example.h, since secrets.h isn't in git)
name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # The ESP32 core + toolchain is ~1 GB: cache it so only the first run downloads it
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino
          key: arduino-${{ hashFiles('firmware/sketch.yaml') }}
      - name: Compile (ESP32-S3)
        run: arduino-cli compile --profile s3 firmware
