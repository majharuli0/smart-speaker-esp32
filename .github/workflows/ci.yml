# Runs on every push and pull request:
#   backend  - the backend tests (npm test)
#   firmware - compiles the ESP32-S3 firmware, using firmware/sketch.yaml
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # The ESP32 core + toolchain is ~1 GB: cache it so only the first run downloads it
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino
          key: arduino-${{ hashFiles('firmware/sketch.yaml') }}
      - name: Compile (ESP32-S3)
        run: arduino-cli compile --profile s3 firmware
