<title>Smart Speaker Circuit Diagram</title>

<style>
/* Layout: a report figure on white. Power buses on top, the ESP32 in the middle, inputs left, outputs right, legend and notes below. */
:root {
  --bg: #ffffff; --ink: #14213d; --muted: #5b6475; --line: #d9dee7;
  --p3: #2a62c9; --gnd: #1b1f24; --p5: #d42f2f; --sig: #e5761a;
  --in: #1f4e9c; --out: #6b35a8; --card: #ffffff; --pinbox: #f4f6fa;
  --font: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.scroll { overflow-x: auto; max-width: 1500px; margin: 0 auto; }
svg.cd { display: block; width: 100%; min-width: 1000px; height: auto; }
.t { fill: var(--ink); font: 700 30px var(--font); }
.ti { font-style: italic; }
.h { fill: var(--ink); font: 700 15px var(--font); }
.hs { fill: var(--muted); font: 600 13px var(--font); }
.col { fill: var(--ink); font: 700 14px var(--font); letter-spacing: 0.08em; }
.pl { fill: var(--ink); font: 600 12px var(--font); }
.ep { fill: var(--ink); font: 700 12px var(--font); }
.cap { fill: var(--muted); font: 600 12px var(--font); }
.sl { fill: var(--sig); font: 600 12px var(--font); }
.bl { font: 700 15px var(--font); }
.cardi { fill: var(--card); stroke: var(--in); stroke-width: 2; }
.cardo { fill: var(--card); stroke: var(--out); stroke-width: 2; }
.esp { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.pinbox { fill: var(--pinbox); stroke: var(--muted); stroke-width: 1; }
.badgei { fill: var(--in); } .badgeo { fill: var(--out); }
.bt { fill: #ffffff; font: 700 13px var(--font); }
.w { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.p3 { stroke: var(--p3); } .p3f { fill: var(--p3); } .p3t { fill: var(--p3); }
.gn { stroke: var(--gnd); } .gnf { fill: var(--gnd); }
.p5 { stroke: var(--p5); } .p5f { fill: var(--p5); } .p5t { fill: var(--p5); }
.sg { stroke: var(--sig); } .sgf { fill: var(--sig); }
.res { fill: var(--card); stroke: var(--sig); stroke-width: 2; }
.lbox { fill: var(--card); stroke-width: 2; }
.box { fill: var(--card); stroke: var(--muted); stroke-width: 1.5; }
.spk { fill: #2b2f36; } .spk2 { fill: #5b616b; }
</style>
</head>

<svg class="cd" viewBox="0 0 1500 1040" role="img" aria-label="Circuit diagram of the smart speaker: an ESP32-S3 board in the centre; inputs on the left (two INMP441 microphones on GPIO 7, 8, 9; STOP/SOS and MOMO buttons on GPIO 1 and 2; DS3231 clock on GPIO 21 and 47); outputs on the right (MAX98357A amplifier and speaker on GPIO 4, 5, 6; RGB LED on GPIO 15, 16, 17 through 330 ohm resistors; microSD module on GPIO 10 to 13); shared 3.3 V, ground and 5 V lines along the top.">

  <line x1="850" y1="146" x2="1200" y2="146" class="w p5"/>

  <text x="680" y="866" text-anchor="middle" class="h">NOTES</text>
  <text x="372" y="894" class="pl">• All grounds (GND) are common.</text>
  <text x="372" y="918" class="pl">• Microphones, microSD and the clock run on 3.3V; only the amplifier uses +5V (from USB).</text>
  <text x="372" y="942" class="pl">• Mic A and Mic B share every wire; L/R picks the channel (A to GND = left, B to 3.3V = right).</text>
  <text x="372" y="966" class="pl">• The buttons need no resistors: the ESP32's internal pull-ups are used.</text>
  <text x="372" y="990" class="pl">• STOP press: stops everything. STOP held 3 s: SOS to the family. MOMO press: Momo listens.</text>
